name: Mobile app checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/frontend/**'
      - 'scripts/mobile/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm*.yaml'
      - 'restore_workspace.py'
      - '.github/workflows/mobile-app-checks.yml'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python restore_workspace.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:mobile
      - run: node --test tests/frontend/web_mobile_session.test.cjs tests/forest-return-safety.test.cjs
      - run: node --test tests/forest-feed-performance.test.cjs tests/forest-preview-performance.test.cjs
      - run: node --test --test-name-pattern='photo|meal|walking|amount|activity submission' tests/frontend/challenge_v3.test.cjs
      - run: pnpm build:mobile:deployment
        env:
          MOBILE_API_ORIGIN: https://www.dang-no.life
      - run: pnpm exec cap sync android
      - run: python -m pip install pytest
      - run: python -m pytest -q tests/test_restore_workspace_overlays.py
