name: ah-05-02

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - healthcare
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  qdrant:
    image: qdrant/qdrant:v1.15.5
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - healthcare

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${DB_EXPOSE_PORT:-3306}:${DB_PORT:-3306}"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --port=${DB_PORT:-3306}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - healthcare
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
      args:
        ML_RESEARCH_RUNTIME: "true"
    image: ${DOCKER_USER:-local}/${DOCKER_REPOSITORY:-ah-05-02}:app-${APP_VERSION:-v0.1.0}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_GENERATE_SCHEMAS: "true"
      ML_RESEARCH_ENDPOINTS_ENABLED: "true"
      ML_SHARED7_MODEL_URI: /app/models/artifacts/candidates/diabetes_current_screening/knhanes-shared7-sk180-v1/model.joblib
      ML_SHARED8_MODEL_URI: /app/models/artifacts/candidates/diabetes_current_screening/knhanes-shared8-waist-sk180-v1/model.joblib
      ML_FIRST_INTERVAL_MODEL_URI: /app/models/artifacts/candidates/diabetes_incidence/rf25-first-interval-survival-ensemble-v1/model.joblib
      ML_RF25_MODEL_URI: /app/models/artifacts/candidates/diabetes_incidence/rf25-tuned-education4-v2/model.joblib
      FOOD_VISION_PROVIDER: local_kfood
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_VLM_MODEL: ${OPENAI_VLM_MODEL:-gpt-4o-mini}
      OPENAI_VLM_FALLBACK_ENABLED: ${OPENAI_VLM_FALLBACK_ENABLED:-false}
      KFOOD_CLASSIFIER_PATH: ${KFOOD_CLASSIFIER_PATH:-/app/models/artifacts/food_vision/kfood/best.pt}
      KFOOD_CLASSIFIER_META_PATH: ${KFOOD_CLASSIFIER_META_PATH:-/app/models/artifacts/food_vision/kfood/meta.json}
      KFOOD_SEGMENTER_PATH: ${KFOOD_SEGMENTER_PATH:-/app/models/artifacts/food_vision/kfood/1.tflite}
      KFOOD_SEGMENTATION_CONFIG_PATH: /app/configs/food_vision/seg_config.json
      KFOOD_DISH_VEGETABLES_PATH: /app/configs/food_vision/dish_vegetables.json
      KFOOD_DRIVE_FILE_ID: ${KFOOD_DRIVE_FILE_ID:-1KvCX9bU9GwZvcvZSl0eYHlZ-yg4UbAjQ}
      KFOOD_BUNDLE_SHA256: ${KFOOD_BUNDLE_SHA256:-753d7c4d3a7d9f9e074565cda0233179243466129a48830fd299a07a9bf0b96c}
      KFOOD_BUNDLE_DIR: ${KFOOD_BUNDLE_DIR:-/app/storage/food_vision/kfood}
    command: ["sh", "app/start-fastapi.sh", "--reload"]
    volumes:
      - ./app:/app/app
      - ./src/frontend:/app/src/frontend:ro
      - ./models:/app/models:ro
      - food_vision_cache:/app/storage/food_vision
      - ./configs:/app/configs:ro
      - ./src/ocr:/app/src/ocr:ro
      - ./src/wearables:/app/src/wearables:ro
      - ./src/quiz:/app/src/quiz:ro
      - ./src/rag:/app/src/rag:ro
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        - CMD
        - uv
        - run
        - --no-sync
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - healthcare
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  ai-worker:
    build:
      context: .
      dockerfile: ai_worker/Dockerfile
    image: ${DOCKER_USER:-local}/${DOCKER_REPOSITORY:-ah-05-02}:ai-${AI_WORKER_VERSION:-v0.1.0}
    restart: unless-stopped
    env_file:
      - .env
    command: ["uv", "run", "--no-sync", "python", "-m", "ai_worker.main"]
    mem_limit: 4g
    deploy:
      replicas: 3
    volumes:
      - ./models:/app/storage/models:ro
      - ./models:/app/models:ro
      - model_cache:/app/storage/cache
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/ai-worker-ready"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks:
      - healthcare
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      fastapi:
        condition: service_healthy

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    image: ${DOCKER_USER:-local}/${DOCKER_REPOSITORY:-ah-05-02}:web-${APP_VERSION:-v0.1.0}
    restart: unless-stopped
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks:
      - healthcare
    depends_on:
      fastapi:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  model_cache:
  food_vision_cache:
  qdrant_data:

networks:
  healthcare:
    driver: bridge
